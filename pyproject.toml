[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ibm-recs"
version = "1.0.0"
description = "Article recommendations for the IBM Watson Studio community: rank-based, user-user, content-based and SVD."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tyrone G. Verdell" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
web = ["flask>=3.1"]

[project.scripts]
ibm-recs-web = "ibm_recs.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibm_recs = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
